name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: PR pushes cancel the outdated run; main pushes queue
# instead, so `latest` on GHCR always reflects the newest merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Fails the PR when web/src/types.ts is stale relative to the source of
  # truth (server/src/types.ts). Dependency-free script — no npm ci needed.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/sync-types.mjs --check

  # Boots the real compose stack and exercises the proxy-dependent critical
  # path. The unit suites cover each package in isolation; nothing else in
  # this workflow ever RUNS what it builds, which is how a broken
  # nginx Host header left log streaming dead for 11 days with every check
  # green. See docs/superpowers/specs/2026-07-25-smoke-tests-design.md.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack on the CI fixture credentials
        run: docker compose --env-file .env.smoke up -d --build
      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health | grep -q '"ok":true'; then
              echo "healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy within 60s"
          exit 1
      - name: Run the smoke checks
        run: node scripts/smoke.mjs
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose --env-file .env.smoke logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose --env-file .env.smoke down -v

  # Builds both container images on every run (a broken Dockerfile fails
  # the PR); pushes to GHCR only on push events, which this workflow
  # receives only for main. Tests, lint, and the types-mirror check gate
  # the push via needs — a stale mirror must not publish on a direct push
  # to main.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [server, web, contract, smoke]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.package }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.package }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,scope=${{ matrix.package }},mode=max

services:
  server:
    build: ./server
    environment:
      NODE_ENV: production
      # Both required — compose reads them from a .env file next to this
      # file or from the shell. See README "Authentication & audit log".
      FLEET_SESSION_SECRET: ${FLEET_SESSION_SECRET:?set FLEET_SESSION_SECRET (32+ chars) in .env}
      FLEET_USERS: ${FLEET_USERS:?set FLEET_USERS (JSON array) in .env}
      AUDIT_DB_PATH: /data/audit.db
      FLEET_COOKIE_SECURE: ${FLEET_COOKIE_SECURE:-false}
    volumes:
      # Read-write Docker socket: Phase 2 adds start/stop/restart. This is
      # root-equivalent access to the host — which is why actions require
      # the operator/admin role and are audited fail-closed. Note the
      # console can stop its own containers (server/web) from its own UI;
      # there is deliberately no self-guard (see README security notes).
      - /var/run/docker.sock:/var/run/docker.sock
      - audit-data:/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

  # --- demo fleet -----------------------------------------------------
  # A couple of throwaway containers so the dashboard has something to
  # show on first run. Delete this section when pointing at a real host.
  demo-nginx:
    image: nginx:alpine
    restart: unless-stopped

  demo-redis:
    image: redis:alpine
    restart: unless-stopped

volumes:
  audit-data:
